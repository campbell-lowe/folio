<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&display=swap">
<style>
:root{--bg:#FAF5EF;--sf:#EDE1D3;--ink:#49334F;--mu:#765749;--rose:#D9A6AD;--mauve:#B7A1C9;--sage:#A8B9A0;--gold:#C6A467;--card:#FFFBF6;--pri:#49334F;--onpri:#FAF5EF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1F1722;--sf:#2D2231;--ink:#F4EAEE;--mu:#D3BEB3;--card:#292030;--pri:#B7A1C9;--onpri:#1F1722}}
:root[data-theme=dark]{--bg:#1F1722;--sf:#2D2231;--ink:#F4EAEE;--mu:#D3BEB3;--card:#292030;--pri:#B7A1C9;--onpri:#1F1722}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--sf);font:400 15px/1.45 'DM Sans',system-ui,sans-serif;color:var(--ink)}
#app{max-width:430px;height:100%;margin:auto;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;overflow-y:auto;padding-bottom:20px}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,.logo,.tt{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
h1{font-size:29px;line-height:1.1;margin:6px 20px}h2{font-size:21px}h3{font-size:18px}
.logo{font-style:italic;font-size:27px}
.sub,.mu{color:var(--mu)}.sub{margin:0 20px 14px}.mu{font-size:13px}
.top{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.av{width:36px;height:36px;border-radius:50%;flex:none;border:2px solid var(--gold)}
.seg{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto}
.seg button{white-space:nowrap;border:1px solid var(--rose);background:none;color:var(--ink);padding:8px 14px;border-radius:12px;font:500 14px 'DM Sans';min-height:40px}
.seg .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid rgba(118,87,73,.2);border-radius:18px;margin:0 20px 16px;overflow:hidden;box-shadow:0 6px 18px rgba(73,51,79,.1)}
.pad{padding:12px 14px}.who{display:flex;gap:10px;align-items:center}
.vid{height:190px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(150deg,var(--a),var(--b))}
.vid .cv{transform:rotate(-4deg)}
.play{position:absolute;right:12px;bottom:12px;width:46px;height:46px;border-radius:50%;background:#FAF5EF;color:#49334F;border:0;display:grid;place-items:center}
.dur{position:absolute;left:12px;bottom:14px;color:#FAF5EF;font-size:12px}
.tag{border:0;border-radius:10px;padding:6px 10px;font:500 12px 'DM Sans';min-height:34px;display:inline-flex;gap:5px;align-items:center;margin:8px 6px 0 0;color:#2d1f33}
.tag.f{background:var(--sage)}.tag.s{background:var(--rose)}
.btn{display:block;width:100%;background:var(--pri);color:var(--onpri);border:0;border-radius:14px;padding:14px 18px;font:700 15px 'DM Sans';min-height:48px}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.lnk{background:none;border:0;color:var(--mu);text-decoration:underline;min-height:44px;font-size:14px;width:100%}
.end{margin:8px 20px;padding:22px;border-radius:18px;background:var(--sf);text-align:center}.end p{color:var(--mu);margin:6px 0 14px}
.nav{display:flex;border-top:1px solid rgba(118,87,73,.25);background:var(--bg);padding:6px 4px}
.nav button{flex:1;background:none;border:0;color:var(--mu);font:500 11px 'DM Sans';display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
.nav .on{color:var(--ink);font-weight:700}.nav .on::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cr{background:var(--rose);color:#2d1f33;border-radius:12px;width:40px;height:30px;display:grid;place-items:center}
.cv{position:relative;overflow:hidden;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;background:linear-gradient(160deg,var(--a),var(--b));color:#FAF5EF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8%;gap:6%;flex:none;font-family:Fraunces,Georgia,serif;box-shadow:inset 3px 0 0 rgba(255,255,255,.2),0 5px 12px rgba(30,15,35,.3)}
.cv svg{width:28%;color:#C6A467}.cv b{font-weight:600;line-height:1.1}.cv small{opacity:.85;font:400 .72em 'DM Sans'}
.xs{width:46px;font-size:7px}.sm{width:64px;font-size:9px}.md{width:98px;font-size:12px}.lg{width:140px;font-size:16px}.xs small,.sm small{display:none}
.row{display:flex;gap:14px;padding:12px 20px;align-items:center;border-bottom:1px solid rgba(118,87,73,.15)}
.cvb{background:none;border:0;padding:0}.g{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.pg{height:6px;border-radius:3px;background:var(--sf)}.pg i{display:block;height:100%;background:#7c9672;border-radius:3px}
.mini{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:8px 12px;font:700 13px 'DM Sans';min-height:40px}.mini.o{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.rt{display:inline-flex;gap:6px;border:0;background:none;padding:2px 0;min-height:36px;font:700 12px 'DM Sans';color:#2d1f33;flex-wrap:wrap;align-items:center}.rt:only-child{background:var(--sf);color:var(--ink);padding:6px 10px;border-radius:10px;font-weight:500}.rt span{border-radius:8px;padding:3px 8px}.cs{background:var(--rose)}.cf{background:var(--sage)}.rt small{font-weight:400}.rr{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(118,87,73,.15)}.hb{display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:center;font-size:12px;padding:3px 0}.sin{width:100%;border:1.5px solid var(--rose);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);font:inherit;min-height:46px}.opts{display:grid;gap:8px;margin-top:8px}.opt{display:flex;flex-direction:column;text-align:left;border:1.5px solid var(--rose);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:48px;font:inherit}.opt span{color:var(--mu);font-size:13px}.opt.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}details summary{cursor:pointer}.lnk2{background:var(--sf);border:0;color:var(--ink);border-radius:8px;padding:4px 10px;font:500 12px 'DM Sans';min-height:32px;align-self:flex-start}.cv>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.s2{display:flex;gap:6px;flex-wrap:wrap}.s2 button{border:1px solid var(--rose);background:none;color:var(--ink);border-radius:10px;padding:6px 10px;font:500 13px 'DM Sans';min-height:40px}.s2 .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.pal{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.cx{outline:1px solid color-mix(in srgb,currentColor 50%,transparent);outline-offset:-6px}.cx svg{color:inherit;opacity:.85}.acts{display:flex;flex-direction:column;gap:6px}.gold{color:#A07F3F;letter-spacing:2px}
.tiles{display:flex;gap:10px;padding:0 20px 16px}.tile{flex:1;border:0;border-radius:16px;padding:12px;text-align:left;color:#2d1f33;font:700 14px 'DM Sans';min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.hero{padding:14px 20px 22px;background:linear-gradient(170deg,var(--a),var(--b));color:#FAF5EF;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.hero .ib{align-self:flex-start;background:rgba(250,245,239,.18);color:#FAF5EF;border:0;border-radius:12px;width:44px;height:44px;display:grid;place-items:center}
.hero p{margin:0;opacity:.9}
.lock{position:relative}.blur{filter:blur(7px);opacity:.55;pointer-events:none}.sk{height:72px;border-radius:14px;background:var(--sf);margin:0 20px 12px}
.lockcard{background:var(--card);margin:-150px 20px 20px;position:relative;border-radius:18px;padding:22px;text-align:center;box-shadow:0 10px 28px rgba(73,51,79,.25);border:1px solid rgba(118,87,73,.2)}
.lockcard p{color:var(--mu);margin:8px 0 16px}
.warn{margin:0 20px 12px;padding:10px 14px;background:var(--rose);color:#2d1f33;border-radius:12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.warn button{background:none;border:0;color:#2d1f33;text-decoration:underline;min-height:44px}
.item{display:flex;gap:12px;padding:12px;align-items:center}.th{width:64px;height:64px;border-radius:12px;flex:none;background:linear-gradient(150deg,var(--a),var(--b));display:grid;place-items:center;color:#FAF5EF;font:700 10px 'DM Sans';text-transform:uppercase;letter-spacing:.06em}
.cm{display:flex;gap:10px;padding:8px 20px}.cm div{background:var(--sf);padding:8px 12px;border-radius:4px 14px 14px 14px;flex:1}
.cmp{display:flex;gap:8px;padding:8px 20px}.cmp input{flex:1;border:1.5px solid var(--rose);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink);font:inherit;min-height:46px}
.goal{display:flex;gap:10px;padding:0 20px 16px}.goal button{flex:1;border:1.5px solid var(--rose);background:var(--card);color:var(--ink);border-radius:16px;font:600 38px Fraunces,Georgia,serif;min-height:96px}.goal .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:flex;gap:6px;margin:6px 20px 12px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--sf)}.dots i.f{background:#7c9672}
.ov{position:absolute;inset:0;background:rgba(30,15,35,.5);display:flex;align-items:flex-end;z-index:5}.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;left:20px;right:20px;bottom:76px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:6;font-weight:500}
.case{margin:0 20px 16px;border-radius:18px;padding:4px 0 14px;background:var(--th,var(--sf))}.lbl{font:italic 600 17px Fraunces,Georgia,serif;padding:12px 16px 0;color:#2d1f33}
.shelf{display:flex;gap:7px;align-items:flex-end;padding:14px 12px 0}.plank{height:12px;margin:0 8px;border-radius:2px;background:linear-gradient(#8a6552,#5f4234);box-shadow:0 5px 8px rgba(0,0,0,.25)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent}.sw.on{border-color:var(--ink)}
.pick{display:flex;gap:14px;align-items:center;width:calc(100% - 40px);margin:0 20px 12px;padding:12px;border-radius:16px;border:1.5px solid var(--rose);background:var(--card);color:var(--ink);text-align:left}.pick.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
input[type=range]{width:100%;accent-color:#49334F;min-height:44px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const I={
lock:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>',
home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
disc:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
club:'<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/>',
lib:'<rect x="4" y="3" width="5" height="18" rx="1"/><rect x="11" y="3" width="5" height="18" rx="1"/><path d="M18 5l3 .8-3.5 14.5-3-.8z"/>'};
const O=['<path d="M20 12a8 8 0 1 1-8-8 6 6 0 0 0 8 8z"/>','<path d="M12 3l2.2 6.3 6.3.2-5 4 1.8 6.3L12 16l-5.3 3.8 1.8-6.3-5-4 6.3-.2z"/>','<path d="M5 19C5 9 10 4 20 4c0 10-5 15-15 15zM5 19l9-9"/>'];
const B=[
{id:'wok',isbn:'9780765326355',t:'The Way of Kings',au:'Brandon Sanderson',a:'#35557c',b:'#101c33',o:0,h:'Storms, ancient oaths and a world that rewards patience.'},
{id:'hc',t:'The Hollow Crown',au:'Mara Ellison',a:'#8a2f4f',b:'#33121f',o:1,h:'A throne, a fragile treaty, and a queen nobody underestimates twice.'},
{id:'sl',t:'Salt & Starlight',au:'Iris Vale',a:'#2f7a78',b:'#122f3c',o:2,h:'Sea-witch romance with salt-sharp prose.'},
{id:'rp',t:'The Rosewater Pact',au:'Elena Marsh',a:'#a24a65',b:'#4a1a33',o:1,h:'Two rival florists and one very unlikely truce.'},
{id:'ms',t:'Moth Season',au:'T. L. Okafor',a:'#8a6a3b',b:'#3f2b1a',o:0,h:'A quiet mystery in a town of moth keepers.'},
{id:'gi',t:'A Garden of Ink',au:'Noor Haddad',a:'#4f6b45',b:'#1f3326',o:2,h:'Tattoo artists and a map that rewrites itself.'},
{id:'cd',t:'The Cartographer’s Daughter',au:'Wren Aldous',a:'#6b4e8a',b:'#271a3d',o:1,h:'A mapmaker’s daughter and a coastline that keeps changing.'},
{id:'wb',t:'Winterbloom',au:'Hana Petrov',a:'#3a6f92',b:'#1a2f45',o:2,h:'Cozy found-family fantasy in a town where winter never leaves.'}];
const bk=id=>B.find(b=>b.id==id);
const cv=(b,z='md')=>`<div class="cv ${z}" style="--a:${b.a};--b:${b.b}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">${O[b.o]}</svg><b>${b.t}</b><small>${b.au}</small>${cvimg(b)}</div>`;
const L={wok:{s:'reading',p:40,d:1},rp:{s:'fin',r:5,d:1},gi:{s:'fin',r:4,d:1},ms:{s:'pause',p:20,d:1},sl:{s:'want',d:0}};
const S={tab:'home',sub:null,hf:'all',n:3,found:[],saved:[],i:0,hub:'hc',side:'free',seg:'reading',pro:false,theme:'#D9A6AD',rb:'wok',ch:22,goal:'',cm:{},toast:'',sheet:0,dsess:0,as:null,asd:0,dp:{ms:{m:'custom',bg:'#D9A6AD',fg:'auto'}}};
const P=[
{c:'pagesandplum',col:'#D9A6AD',b:[['hc','f']],t:'Three reasons the court politics hooked me',f:'following'},
{c:'inkedmargins',col:'#B7A1C9',b:[['rp','f'],['gi','s']],t:'Two slow-burn romances, compared',f:'following'},
{c:'lunareads',col:'#A8B9A0',b:[['wok','f']],t:'Why the worldbuilding keeps me reading',f:'interest'},
{c:'iris.vale',col:'#C6A467',b:[['sl','f']],t:'Author note: where the sea chapters began',f:'interest',au:1}];
const T={f:[['Reader reaction','@pagesandplum','First impressions, no plot details.','Video'],['Review · 4.5★','@inkedmargins','Prose, pacing and who it’s for.','Review'],['Worldbuilding talk','24 replies','What stands out about the setting?','Chat'],['Fan art: cover redraw','@lunareads','Ink and watercolor.','Art']],
s:[['Ending reactions','@pagesandplum','Full spoilers for the finale.','Video'],['Theory thread','31 replies','What the last chapter really implies.','Chat'],['Favorite scenes, ranked','@inkedmargins','Spoilers throughout.','Review']]};
const SL2={reading:'Reading',want:'Want to read',fin:'Finished',pause:'Paused'};
const PAL=['#D9A6AD','#F2CFD3','#B7A1C9','#49334F','#A8B9A0','#3F5B45','#C6A467','#765749','#8FB3C9','#FAF5EF','#E58C7A','#1F2A44'],RB=['#E58C7A','#C6A467','#E6D27A','#A8B9A0','#8FB3C9','#B7A1C9','#D9A6AD'];
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4),lum=h=>{const[r,g,b]=hx(h);return .2126*r+.7152*g+.0722*b},cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const fgOf=(bg,fg)=>fg&&fg!='auto'?fg:(cr(bg,'#FAF5EF')>=cr(bg,'#2B1B2E')?'#FAF5EF':'#2B1B2E');
const cvimg=b=>b.isbn?`<img src="https://covers.openlibrary.org/b/isbn/${b.isbn}-L.jpg?default=false" alt="" loading="lazy" onerror="this.remove()">`:'';
const scv=(id,z)=>{const d=S.dp[id],b=bk(id);if(!S.pro||!d||d.m!='custom')return cv(b,z);return `<div class="cv cx ${z}" style="background:${d.bg};color:${fgOf(d.bg,d.fg)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">${O[b.o]}</svg><b>${b.t}</b><small>${b.au}</small></div>`};
const cust=()=>{const ids=Object.keys(L).filter(i=>L[i].d);return `<div class="card pad"><h3>Customize my books</h3><p class="mu" style="margin:4px 0 10px">Official covers are the default. Custom designs only change how a book looks on your shelf.</p>${ids.map(id=>{const b=bk(id),d=S.dp[id]||{m:'official'},c=d.m=='custom',bg=d.bg||'#D9A6AD',f=fgOf(bg,d.fg);return `<div style="padding:10px 0;border-top:1px solid rgba(118,87,73,.15)"><div class="r">${scv(id,'xs')}<div class="g"><b class="tt" style="font-size:15px">${b.t}</b><div class="s2"><button class="${c?'':'on'}" data-a="dm:${id}:official">Official cover</button><button class="${c?'on':''}" data-a="dm:${id}:custom">Custom design</button></div></div></div>${c?`<div class="pal">${PAL.map(p=>`<button class="sw ${bg.toLowerCase()==p.toLowerCase()?'on':''}" style="background:${p};width:38px;height:38px" aria-label="Color ${p}" data-a="dbg:${id}:${p}"></button>`).join('')}<label class="mu" style="display:flex;align-items:center;gap:6px">Custom <input type="color" value="${bg}" data-c="${id}" aria-label="Custom color for ${b.t}" style="width:44px;height:38px;border:0;padding:0;background:none"></label></div><div class="mu" style="margin:6px 0 4px">Text color</div><div class="s2">${[['auto','Auto'],['#FAF5EF','Ivory'],['#2B1B2E','Ink'],['#E8C97A','Gold']].map(([v,t])=>`<button class="${(d.fg||'auto')==v?'on':''}" data-a="dfg:${id}:${v}">${t}</button>`).join('')}</div>${cr(bg,f)<4.5?'<div class="mu" style="margin-top:4px">⚠ Low contrast: the title may be hard to read.</div>':''}<button class="mini o" style="margin-top:8px" data-a="allc:${id}">Use this color on all books</button>`:''}</div>`}).join('')}<div class="s2" style="margin-top:8px"><button data-a="rainbow">Rainbow shelf</button><button data-a="resetall">All official covers</button></div></div>`};
const asheet=()=>{const id=S.as,b=bk(id),l=L[id];return `<div class="ov"><div class="sheet"><div class="who">${cv(b,'xs')}<div><h2 style="font-size:19px">${b.t}</h2><div class="mu">${l?'Change reading status':'Add to your list'}</div></div></div>${[['want','Want to Read'],['reading','Currently Reading'],['fin','Finished'],...(l?[['pause','Paused']]:[])].map(([k,t])=>`<button class="btn ${l&&l.s==k?'':'o'}" data-a="setst:${k}">${l&&l.s==k?'✓ ':''}${t}</button>`).join('')}${l?'<button class="lnk" data-a="unshelf">Remove from my list</button>':''}<button class="lnk" data-a="closeas">Cancel</button></div></div>`};

const rate=()=>{const id=S.rid,b=bk(id),g=agg(id),sc=(t,e,v,n,h,d)=>`<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>${t}</h3><b>${v==null?'Not rated yet':f1(v)+' / 5'}</b></div>${v==null?'<p class="mu">No reader surveys cover this scale yet.</p>':`<div style="font-size:22px">${ico(v,e)}</div><div class="mu">Based on ${n} reader survey${n>1?'s':''}</div><div class="mu">${agr(h)}</div><div style="margin-top:8px">${bars(h,e)}</div><div class="mu" style="font-size:12px">Rows show how many surveys landed on each value</div>`}<details style="margin-top:10px"><summary style="min-height:44px;display:flex;align-items:center">What the ${t.toLowerCase()} scale means</summary>${d.map((x,i)=>`<div class="mu" style="padding:3px 0"><b>${i}</b> · ${x}</div>`).join('')}</details></div>`;
return `<div class="top"><button class="lnk" style="width:auto" data-a="back">‹ Back</button><b>Content ratings</b></div><div class="row" style="border:0">${cv(b,'xs')}<div class="g"><b class="tt">${b.t}</b><span class="mu">${b.au}</span></div></div><p class="mu" style="margin:0 20px 12px">Community-reported with mock prototype data. This is not an official or definitive rating.</p>${g.sn||g.cn?'':'<div class="end" style="margin:0 20px 12px"><h2>Not rated yet</h2><p>No reader surveys yet. Be the first to add one.</p></div>'}${sc('Spice','🌶️',g.sp,g.sn,g.sh,SPD)}${sc('Cleanliness','🍃',g.cl,g.cn,g.ch,LFD)}<div class="card pad"><h3 style="margin-bottom:8px">Content breakdown</h3>${g.cat.map(([t,n,m,l])=>`<div class="hb" style="grid-template-columns:1fr auto"><div><b>${t}</b>: ${l||'No data'}<div class="pg" style="margin-top:4px"><i style="width:${m==null?0:m/4*100}%"></i></div></div><span>${n} surveys</span></div>`).join('')}<h3 style="margin:12px 0 6px;font-size:16px">Content warnings</h3>${!W[id]?'<p class="mu" style="margin:0">None reported yet.</p>':L[id]?`<div>${W[id].map(w=>`<span class="tag f" style="background:var(--sf);color:var(--ink)">${w}</span>`).join('')}</div>`:`<p class="mu" style="margin:0 0 8px">Specific warnings can reveal plot details, so they unlock when this book is on your bookshelf.</p><button class="mini" data-a="addsheet:${id}">Add to my list</button>`}</div><div style="padding:0 20px 8px"><button class="btn" data-a="survey">Add your survey</button></div><details class="mu" style="margin:0 20px 16px"><summary style="min-height:44px;display:flex;align-items:center">How scores are calculated</summary>Each answer is scored 0 to 4. Spice = 1.25 × (0.5 × explicitness + 0.3 × frequency + 0.2 × on-page level), from sexual-content answers only. Cleanliness = 5 − 1.25 × the average of the six profanity, violence and themes answers. Each survey is stored on its own, and the averages are calculated from them. The two scales never use each other’s answers.</details>`};
const survey=()=>{const s=S.sv,q=Q[s.i];return `<div class="top"><button class="lnk" style="width:auto" data-a="backr">Cancel</button><b>Step ${s.i+1} of 4</b></div><h1>${q.sec}</h1><p class="sub">${s.i?'Cleanliness needs profanity, violence and themes all answered.':'Optional. Spice uses only these answers.'} Skip anything you don’t remember.</p>${q.qs.map(x=>`<div style="padding:0 20px 14px"><b>${x.q}</b><div class="opts">${x.o.map((o,j)=>{const[a,d]=o.split('|'),on=s.a[x.k]===j;return `<button class="opt ${on?'on':''}" aria-pressed="${on}" data-a="sa:${x.k}:${j}"><b>${on?'✓ ':''}${a}</b>${d?`<span>${d}</span>`:''}</button>`}).join('')}</div></div>`).join('')}<div style="padding:0 20px;display:grid;gap:4px"><button class="btn" data-a="snext">${s.i==3?'Submit survey':'Next'}</button><button class="lnk" data-a="sskip">Skip this section</button></div>`};
function submit(){const s=S.sv,all=Q.flatMap(x=>x.qs),val=k=>{const q=all.find(x=>x.k==k);return q.v?q.v[s.a[k]]:s.a[k]},has=ks=>ks.every(k=>s.a[k]!=null),sx=has(['E','F','P'])?['E','F','P'].map(val):null,cl=has(['pf','ps','vi','vg','tm','tf'])?['pf','ps','vi','vg','tm','tf'].map(val):null;if(!sx&&!cl)return msg('Answer at least one full section to submit');(RS[s.id]=RS[s.id]||[]).push({sx,cl});S.sub='rate';msg('Thanks! Your survey updated this prototype’s mock rating.')}
const res=()=>{const q=(S.q||'').toLowerCase(),l=B.filter(b=>(b.t+b.au).toLowerCase().includes(q));return l.length?l.map(b=>`<div class="row"><button class="cvb" data-a="hub:${b.id}" aria-label="Open ${b.t}">${cv(b,'sm')}</button><div class="g"><b class="tt">${b.t}</b><span class="mu">${b.au}</span>${chips(b.id)}</div><button class="mini ${L[b.id]?'o':''}" data-a="addsheet:${b.id}" aria-label="${L[b.id]?'On My List, change status':'Add to My List'} ${b.t}">${L[b.id]?'✓ Added':'+ Add'}</button></div>`).join(''):'<div class="end"><h2>No matches</h2><p>Try another title or author.</p></div>'};
const V={find,home,discover:dset,dcont,ddone,create,clubs,hub,library,shelf,retain,rcont,rate,survey};
function nav(){const t=[['home','Home','home'],['discover','Discover','disc'],['create','Create','plus'],['clubs','Book Clubs','club'],['library','Bookshelf','lib']];return `<div class="nav">${t.map(([k,l,i])=>`<button class="${S.tab==k?'on':''}" data-a="tab:${k}">${k=='create'?`<span class="cr"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${I[i]}</svg></span>`:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">${I[i]}</svg>`}${l}${k=='create'?' '+I.lock.replace(/15/g,'10'):''}</button>`).join('')}</div>`}
let last='';
function R(){const k=S.sub||S.tab,m=document.getElementById('main'),kk=k+S.side+(k=='survey'?S.sv.i:''),y=m&&last==kk?m.scrollTop:0;last=kk;document.getElementById('app').innerHTML=`<div id="main">${V[k]()}</div>${nav()}${S.sheet?`<div class="ov"><div class="sheet"><h2>Nice find. What next?</h2><p class="mu" style="margin:0">Interest doesn’t mean you’re ready to add it to your list.</p><button class="btn" data-a="dadd">Add to My List</button><button class="btn o" data-a="keep">Save to discovery list</button><button class="lnk" data-a="skip">Never mind</button></div></div>`:''}${S.as?asheet():''}${S.toast?`<div class="toast" role="status">${S.toast}</div>`:''}`;document.getElementById('main').scrollTop=y;const qq=document.getElementById('q');if(qq)qq.oninput=()=>{S.q=qq.value;document.getElementById('res').innerHTML=res()};const r=document.querySelector('[data-r]');if(r)r.oninput=()=>{S.ch=+r.value;document.getElementById('chl').textContent=S.ch}}
function msg(t){S.toast=t;R();clearTimeout(msg.t);msg.t=setTimeout(()=>{S.toast='';R()},2200)}
function fnd(){S.sheet=0;S.found.push(S.cur);if(S.found.length>=S.n){S.sub='ddone';S.dsess=0}R()}
function act(a,v){switch(a){
case'tab':S.tab=v;S.sub=v=='discover'&&S.dsess?'dcont':null;S.side='f';break;
case'back':S.sub=S.prev||null;if(S.prevTab)S.tab=S.prevTab;S.prev=S.prevTab=null;break;
case'back2':S.sub=null;S.tab='library';break;
case'hub':case'hubsp':S.prev=S.sub;S.prevTab=S.tab;S.hub=v;S.sub='hub';S.tab='clubs';S.side=a=='hub'?'f':'s';break;
case'hf':S.hf=v;break;case'n':S.n=+v;break;
case'start':S.found=[];S.i=0;S.dsess=1;S.sub='dcont';break;
case'yes':S.sheet=1;break;case'skip':S.sheet=0;S.i++;break;
case'keep':S.saved.push(S.cur);return fnd();case'addl':addB(S.cur);return fnd();
case'leave':S.sub=null;S.dsess=0;S.found=[];break;
case'fin':S.found=[];S.tab='library';S.sub=null;S.seg='want';break;
case'fb':S.seg='fin';break;case'seg':S.seg=v;break;
case'add':addB(v);return msg('Added to your list. Its club and spoilers are open.');
case'side':S.side=v;break;case'dsp':if(L[v].d){L[v].d=0;return msg('Taken off your shelf. It’s still on your list and its club is open.')}if(dc()>=lim())return msg('Free shelves hold 6 books. Unshelve one first, or preview Pro.');L[v].d=1;break;case'pro':S.pro=v=='1';break;case'theme':S.theme=v;break;
case'retain':S.sub='retain';break;case'rb':S.rb=v;S.ch=Math.max(1,Math.round(L[v].p/2));break;
case'unsure':S.ch=0;return msg('Got it. We’ll keep spoiler protection extra strict.');
case'go':S.sub='rcont';break;case'goal':S.goal=v;break;
case'np':L[S.rb].s='pause';S.sub=null;S.tab='library';S.seg='pause';return msg('No guilt. It’s on your Paused shelf whenever you’re ready.');
case'send':{const i=document.getElementById('ci');if(i&&i.value.trim()){(S.cm[S.hub]=S.cm[S.hub]||[]).push(i.value.trim())}break}
case'rate':S.prev=S.sub;S.prevTab=S.tab;S.rid=v;S.sub='rate';break;case'survey':S.sv={id:S.rid,i:0,a:{}};S.sub='survey';break;case'backr':S.sub='rate';break;case'sa':{const[k,j]=v.split(':');S.sv.a[k]=+j;break}case'snext':if(!Q[S.sv.i].qs.every(x=>S.sv.a[x.k]!=null))return msg('Answer each question, or skip this section');if(S.sv.i<3){S.sv.i++;break}return submit();case'sskip':Q[S.sv.i].qs.forEach(x=>delete S.sv.a[x.k]);if(S.sv.i<3){S.sv.i++;break}return submit();case'addsheet':S.as=v;S.asd=0;break;
case'dadd':S.sheet=0;S.as=S.cur;S.asd=1;break;
case'closeas':S.as=null;if(S.asd){S.asd=0;S.sheet=1}break;
case'setst':{const id=S.as,o=L[id];if(o){o.s=v;if(v=='reading'&&o.p==null)o.p=0}else L[id]=Object.assign({s:v,d:dc()<lim()?1:0},v=='reading'?{p:0}:{});S.as=null;if(S.asd){S.asd=0;return fnd()}return msg(o?'Status updated.':'Added to your list. Its club and spoilers are open.')}
case'unshelf':delete L[S.as];S.as=null;S.asd=0;return msg('Removed from your list.');
case'dm':{const[id,m]=v.split(':');S.dp[id]=Object.assign({bg:'#D9A6AD'},S.dp[id],{m});break}
case'dbg':{const[id,c]=v.split(':');S.dp[id]=Object.assign({},S.dp[id],{m:'custom',bg:c});break}
case'dfg':{const[id,c]=v.split(':');S.dp[id]=Object.assign({bg:'#D9A6AD'},S.dp[id],{m:'custom',fg:c});break}
case'allc':{const bg=S.dp[v].bg;Object.keys(L).filter(i=>L[i].d).forEach(i=>S.dp[i]=Object.assign({},S.dp[i],{m:'custom',bg}));break}
case'rainbow':Object.keys(L).filter(i=>L[i].d).forEach((i,k)=>S.dp[i]=Object.assign({},S.dp[i],{m:'custom',bg:RB[k%7]}));break;
case'resetall':Object.keys(S.dp).forEach(k=>S.dp[k].m='official');break;
case'find':S.q='';S.tab='library';S.sub='find';break;
case'toast':return msg(v)}R()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const s=t.dataset.a,i=s.indexOf(':');i<0?act(s):act(s.slice(0,i),s.slice(i+1))});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.c;if(id){S.dp[id]=Object.assign({},S.dp[id],{m:'custom',bg:e.target.value});R()}});
R();
</script>
